name: PT-BR TextMap Context

on:
  push:
    branches:
      - feature/pt-br-support
    paths:
      - tools/ptbr_textmap_context.py
      - reports/ptbr-strict-ocr.json
      - .github/workflows/ptbr-textmap-context.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pt-br-support
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ptbr_textmap_context.py
      - name: Commit context report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ptbr-textmap-context.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update PT-BR TextMap context"
          git push origin HEAD:feature/pt-br-support
