name: PT-BR Strict OCR Audit

on:
  push:
    branches:
      - feature/pt-br-support
    paths:
      - tools/ptbr_strict_scan.py
      - tools/ptbr_apply_textmap.py
      - tools/ptbr_audited_literals.json
      - tools/ptbr_manual_fixes.py
      - tools/ptbr_targeted_regression.py
      - reports/ptbr-textmap-resolved.json
      - .github/workflows/ptbr-strict-audit.yml
      - 'repo/js/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pt-br-support
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited PT-BR literal mappings
        run: python tools/ptbr_apply_textmap.py
      - name: Apply targeted language-independent fixes
        run: python tools/ptbr_manual_fixes.py
      - name: Require targeted regressions fixed
        run: python tools/ptbr_targeted_regression.py --report reports/ptbr-targeted-after.json
      - name: Scan direct OCR dependencies
        run: python tools/ptbr_strict_scan.py
      - name: Commit fixes and strict audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bettergi.d.ts repo/js reports/ptbr-strict-ocr.json reports/ptbr-targeted-after.json
          if git diff --cached --quiet; then
            echo "Strict audit unchanged."
            exit 0
          fi
          git commit -m "chore: apply targeted PT-BR fixes and update strict audit"
          git push origin HEAD:feature/pt-br-support
