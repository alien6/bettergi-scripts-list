name: PT-BR Strict OCR Audit

on:
  push:
    branches:
      - feature/pt-br-support
    paths:
      - tools/ptbr_strict_scan.py
      - .github/workflows/ptbr-strict-audit.yml
      - 'repo/js/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pt-br-support
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan direct OCR dependencies
        run: python tools/ptbr_strict_scan.py
      - name: Commit strict audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ptbr-strict-ocr.json
          if git diff --cached --quiet; then
            echo "Strict audit unchanged."
            exit 0
          fi
          git commit -m "chore: update strict PT-BR OCR audit"
          git push origin HEAD:feature/pt-br-support
